name: Free CPU proof image preparation
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish to the pre-created Docker Hub repository
permissions:
  contents: read
concurrency:
  group: proof-image-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Confirm AMD64, free disk, and install FFmpeg
        run: |
          test "$(uname -m)" = x86_64
          df -h .
          python3 -c "import shutil; assert shutil.disk_usage('.').free > 512*1024*1024, 'Need 512 MiB free'"
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Validate streamed layer assembly and Linux video delivery
        run: |
          python3 -m unittest discover -p 'test_stream_image.py'
          python3 validate_delivery.py
          python3 stream_image.py
      - name: Publish approved technical image only
        if: inputs.publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: python3 stream_image.py --publish --repository "$IMAGE_REPOSITORY" --tag proof-v1
      - name: Inspect published image without pulling model layers
        if: inputs.publish
        run: python3 inspect_image.py
      - name: Save small build receipt
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: build-receipt
          path: |
            build-receipt.json
            inspection-receipt.json
          retention-days: 1
